<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="eb-bg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#1a1f26" />
      <stop offset="60%" stop-color="#0d1014" />
      <stop offset="100%" stop-color="#030405" />
    </radialGradient>
    <linearGradient id="eb-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eaf6ff" />
      <stop offset="25%" stop-color="#7fd4ff" />
      <stop offset="100%" stop-color="#2d8fe0" />
    </linearGradient>
    <linearGradient id="eb-green" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#effff0" />
      <stop offset="25%" stop-color="#8bf7a0" />
      <stop offset="100%" stop-color="#28c15a" />
    </linearGradient>
    <filter id="eb-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="eb-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#030405" stop-opacity="0" />
      <stop offset="100%" stop-color="#030405" stop-opacity="0.88" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#eb-bg)" />

  <g fill="#ffffff">
    <circle cx="140" cy="90" r="1.5" opacity="0.7" />
    <circle cx="1080" cy="120" r="1.3" opacity="0.6" />
    <circle cx="1000" cy="480" r="1.6" opacity="0.6" />
    <circle cx="90" cy="500" r="1.2" opacity="0.55" />
    <circle cx="600" cy="60" r="1.4" opacity="0.5" />
  </g>

  <g filter="url(#eb-glow)">
    <rect x="-14" y="-190" width="28" height="380" rx="14" fill="url(#eb-blue)"
          transform="translate(600,310) rotate(-32)" />
    <rect x="-16" y="10" width="32" height="60" rx="6" fill="#5a5f66"
          transform="translate(600,310) rotate(-32)" />

    <rect x="-14" y="-190" width="28" height="380" rx="14" fill="url(#eb-green)"
          transform="translate(600,310) rotate(32)" />
    <rect x="-16" y="10" width="32" height="60" rx="6" fill="#5a5f66"
          transform="translate(600,310) rotate(32)" />
  </g>

  <circle cx="600" cy="310" r="22" fill="#ffffff" opacity="0.9" filter="url(#eb-glow)" />

  <rect width="1200" height="630" fill="url(#eb-fade)" />
</svg>
