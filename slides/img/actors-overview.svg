<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Helvetica Neue, Arial, sans-serif">
  <title>Übersicht: User, Harness, Modell, Tools, MCP, Skills</title>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A90936" />
    </marker>
  </defs>

  <!-- connections -->
  <line x1="500" y1="76" x2="428" y2="150" stroke="#A90936" stroke-width="2.5" marker-end="url(#arrow)" />
  <text x="500" y="108" text-anchor="middle" font-size="14" font-weight="600" fill="#A90936">Prompt</text>

  <line x1="570" y1="175" x2="758" y2="175" stroke="#A90936" stroke-width="2.5" marker-end="url(#arrow)" />
  <text x="664" y="163" text-anchor="middle" font-size="14" font-weight="600" fill="#A90936">Kontext</text>

  <line x1="758" y1="215" x2="570" y2="215" stroke="#A90936" stroke-width="2.5" marker-end="url(#arrow)" />
  <text x="664" y="238" text-anchor="middle" font-size="14" font-weight="600" fill="#A90936">Text / Tool-Aufruf</text>

  <line x1="420" y1="240" x2="185" y2="358" stroke="#A90936" stroke-width="2.5" marker-end="url(#arrow)" />
  <line x1="420" y1="240" x2="450" y2="358" stroke="#A90936" stroke-width="2.5" marker-end="url(#arrow)" />
  <line x1="420" y1="240" x2="700" y2="358" stroke="#A90936" stroke-width="2.5" marker-end="url(#arrow)" />
  <text x="420" y="290" text-anchor="middle" font-size="14" font-weight="600" fill="#A90936">führt aus</text>

  <line x1="450" y1="450" x2="450" y2="460" stroke="#A90936" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- User -->
  <rect x="390" y="20" width="220" height="56" rx="10" fill="#f3f3f3" stroke="#A90936" stroke-width="2" />
  <text x="500" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#222">User</text>

  <!-- Harness -->
  <rect x="270" y="150" width="300" height="90" rx="10" fill="#f3f3f3" stroke="#A90936" stroke-width="2.5" />
  <text x="420" y="189" text-anchor="middle" font-size="21" font-weight="700" fill="#222">Harness</text>
  <text x="420" y="212" text-anchor="middle" font-size="13" fill="#666">Claude Code · Codex · ChatGPT · ...</text>

  <!-- Model -->
  <rect x="760" y="150" width="200" height="90" rx="10" fill="#f3f3f3" stroke="#A90936" stroke-width="2" />
  <text x="860" y="189" text-anchor="middle" font-size="21" font-weight="700" fill="#222">Modell</text>
  <text x="860" y="212" text-anchor="middle" font-size="13" fill="#666">Text rein, Text raus</text>

  <!-- Tools -->
  <rect x="50" y="358" width="230" height="90" rx="10" fill="#f3f3f3" stroke="#A90936" stroke-width="2" />
  <text x="165" y="397" text-anchor="middle" font-size="19" font-weight="700" fill="#222">Tools</text>
  <text x="165" y="419" text-anchor="middle" font-size="13" fill="#666">lokal, z. B. Datei lesen</text>

  <!-- MCP -->
  <rect x="335" y="358" width="230" height="90" rx="10" fill="#f3f3f3" stroke="#A90936" stroke-width="2" />
  <text x="450" y="397" text-anchor="middle" font-size="19" font-weight="700" fill="#222">MCP</text>
  <text x="450" y="419" text-anchor="middle" font-size="13" fill="#666">Host ↔ Client ↔ Server</text>

  <!-- Skills -->
  <rect x="620" y="358" width="230" height="90" rx="10" fill="#f3f3f3" stroke="#A90936" stroke-width="2" />
  <text x="735" y="397" text-anchor="middle" font-size="19" font-weight="700" fill="#222">Skills</text>
  <text x="735" y="419" text-anchor="middle" font-size="13" fill="#666">bei Bedarf geladen</text>

  <!-- MCP-Server -->
  <rect x="335" y="460" width="230" height="110" rx="10" fill="#f3f3f3" stroke="#A90936" stroke-width="2" />
  <text x="450" y="490" text-anchor="middle" font-size="19" font-weight="700" fill="#222">MCP-Server</text>
  <text x="450" y="513" text-anchor="middle" font-size="13" fill="#666">Tools · Resources · Prompts</text>
  <text x="450" y="533" text-anchor="middle" font-size="13" fill="#666">remote oder lokal</text>
</svg>
